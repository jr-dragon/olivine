receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/olivine:
    error_mode: ignore
    traces:
      span:
        - resource.attributes["service.name"] != "olivine"
    metrics:
      metric:
        - resource.attributes["service.name"] != "olivine"
    logs:
      log_record:
        - resource.attributes["service.name"] != "olivine"
  batch: {}

exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - filter/olivine
        - batch
      exporters:
        - otlphttp/jaeger
    metrics:
      receivers:
        - otlp
      processors:
        - filter/olivine
        - batch
      exporters:
        - otlphttp/prometheus
    logs:
      receivers:
        - otlp
      processors:
        - filter/olivine
        - batch
      exporters:
        - otlphttp/loki
